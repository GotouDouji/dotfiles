# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include ~/.config/kitty/current-theme.conf
# END_KITTY_THEME
#
# font_family              MonaspaceXenonNF

# bold_font                auto
# italic_font              auto
# bold_italic_font         auto
# allow_remote_control     yes
font_size                16
background_opacity       0.9
cursor_trail             3



# BEGIN_KITTY_FONTS
font_family      family='Monaspace Xenon NF' features='+calt cv01=2 cv10=2 +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09 +ss10 cv30=0 cv31=0'
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
